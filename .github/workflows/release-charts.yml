name: Release Charts

on:
  push:
    branches: [main]
    paths:
      - "**/Chart.yaml"

permissions:
  contents: write # create GitHub releases
  packages: write # push charts to GitHub Container Registry (ghcr.io)

jobs:
  detect:
    name: Detect Changed Charts
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Chart.yaml files
        id: detect
        run: |
          # Get chart directories where Chart.yaml changed in this push
          CHANGED=$(git diff HEAD~1 HEAD --name-only | grep 'Chart.yaml' | xargs -I{} dirname {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Changed charts: $CHANGED"

          if [ "$CHANGED" = "[]" ] || [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "charts=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "charts=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release ${{ matrix.chart }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}
      fail-fast: false # release other charts even if one fails

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # ── Version extraction ────────────────────────────────────────────────

      - name: Extract versions
        id: versions
        run: |
          CHART_DIR="${{ matrix.chart }}"
          CHART_YAML="$CHART_DIR/Chart.yaml"
          CHART_NAME=$(grep '^name:' "$CHART_YAML" | awk '{print $2}')
          NEW_VERSION=$(grep '^version:' "$CHART_YAML" | awk '{print $2}')

          # Find the previous commit that touched this Chart.yaml
          PREV_COMMIT=$(git log --skip=1 -1 --format="%H" -- "$CHART_YAML")

          if [ -n "$PREV_COMMIT" ]; then
            OLD_VERSION=$(git show "${PREV_COMMIT}:${CHART_YAML}" | grep '^version:' | awk '{print $2}')
          else
            OLD_VERSION=""
          fi

          echo "chart_name=$CHART_NAME"     >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION"   >> "$GITHUB_OUTPUT"
          echo "old_version=$OLD_VERSION"   >> "$GITHUB_OUTPUT"
          echo "prev_commit=$PREV_COMMIT"   >> "$GITHUB_OUTPUT"

          echo "Chart:       $CHART_NAME"
          echo "Old version: ${OLD_VERSION:-'(none — first release)'}"
          echo "New version: $NEW_VERSION"

      # ── Version validation ────────────────────────────────────────────────

      - name: Validate version format (semver X.Y.Z)
        run: |
          VERSION="${{ steps.versions.outputs.new_version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not valid semver (expected X.Y.Z)"
            exit 1
          fi
          echo "Version format OK: $VERSION"

      - name: Validate version is monotonically increasing
        if: steps.versions.outputs.old_version != ''
        run: |
          NEW="${{ steps.versions.outputs.new_version }}"
          OLD="${{ steps.versions.outputs.old_version }}"

          # Split into components
          NEW_MAJOR=$(echo "$NEW" | cut -d. -f1)
          NEW_MINOR=$(echo "$NEW" | cut -d. -f2)
          NEW_PATCH=$(echo "$NEW" | cut -d. -f3)

          OLD_MAJOR=$(echo "$OLD" | cut -d. -f1)
          OLD_MINOR=$(echo "$OLD" | cut -d. -f2)
          OLD_PATCH=$(echo "$OLD" | cut -d. -f3)

          # Compare as integers
          if [ "$NEW_MAJOR" -gt "$OLD_MAJOR" ]; then
            echo "Version OK (major bump): $OLD → $NEW"
            exit 0
          elif [ "$NEW_MAJOR" -eq "$OLD_MAJOR" ] && [ "$NEW_MINOR" -gt "$OLD_MINOR" ]; then
            echo "Version OK (minor bump): $OLD → $NEW"
            exit 0
          elif [ "$NEW_MAJOR" -eq "$OLD_MAJOR" ] && [ "$NEW_MINOR" -eq "$OLD_MINOR" ] && [ "$NEW_PATCH" -gt "$OLD_PATCH" ]; then
            echo "Version OK (patch bump): $OLD → $NEW"
            exit 0
          else
            echo "::error::Version must be strictly increasing. Old: $OLD → New: $NEW"
            exit 1
          fi

      # ── Duplicate guard ───────────────────────────────────────────────────

      - name: Check for duplicate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHART_NAME="${{ steps.versions.outputs.chart_name }}"
          NEW_VERSION="${{ steps.versions.outputs.new_version }}"
          RELEASE_TAG="${CHART_NAME}/v${NEW_VERSION}"

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "::error::Release '$RELEASE_TAG' already exists. Bump the version in Chart.yaml to proceed."
            exit 1
          fi
          echo "No existing release found for $RELEASE_TAG — proceeding."

      # ── Helm validation ───────────────────────────────────────────────────

      - name: Helm lint
        run: helm lint ${{ matrix.chart }}/

      - name: Helm template dry-run
        run: helm template ${{ matrix.chart }}/ > /dev/null

      # ── Release notes generation ──────────────────────────────────────────

      - name: Generate release notes
        id: release_notes
        run: |
          CHART_DIR="${{ matrix.chart }}"
          CHART_NAME="${{ steps.versions.outputs.chart_name }}"
          NEW_VERSION="${{ steps.versions.outputs.new_version }}"
          OLD_VERSION="${{ steps.versions.outputs.old_version }}"
          PREV_COMMIT="${{ steps.versions.outputs.prev_commit }}"

          if [ -n "$PREV_COMMIT" ]; then
            COMMITS=$(git log "${PREV_COMMIT}..HEAD" --pretty=format:"- %s" --no-merges -- "$CHART_DIR/")
            SINCE_LABEL="since \`${CHART_NAME}/v${OLD_VERSION}\`"
          else
            COMMITS=$(git log HEAD --pretty=format:"- %s" --no-merges -- "$CHART_DIR/")
            SINCE_LABEL="(initial release)"
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- No chart-scoped commits found."
          fi

          # Write release notes to a file to preserve multiline content
          {
            echo "## What's Changed ${SINCE_LABEL}"
            echo ""
            echo "${COMMITS}"
          } > /tmp/release_notes.md

          echo "Release notes:"
          cat /tmp/release_notes.md

      # ── GHCR Authentication ───────────────────────────────────────────────

      - name: Login Helm to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      # ── Package & Push ────────────────────────────────────────────────────

      - name: Package chart
        run: helm package ${{ matrix.chart }}/

      - name: Push chart to GHCR
        run: |
          CHART_NAME="${{ steps.versions.outputs.chart_name }}"
          NEW_VERSION="${{ steps.versions.outputs.new_version }}"
          OWNER="${{ github.repository_owner }}"
          # OCI references must be lowercase
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          helm push "${CHART_NAME}-${NEW_VERSION}.tgz" \
            "oci://ghcr.io/${OWNER_LC}/charts"

      # ── GitHub Release ────────────────────────────────────────────────────

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHART_NAME="${{ steps.versions.outputs.chart_name }}"
          NEW_VERSION="${{ steps.versions.outputs.new_version }}"
          RELEASE_TAG="${CHART_NAME}/v${NEW_VERSION}"

          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "${CHART_NAME} v${NEW_VERSION}" \
            --notes-file /tmp/release_notes.md \
            "${CHART_NAME}-${NEW_VERSION}.tgz"

          echo "::notice::Released ${RELEASE_TAG} — $(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json url -q .url)"
