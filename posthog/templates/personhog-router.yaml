{{- $component := "personhog-router" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $component "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not (coalesce .Values.personhogRouter.autoscaling .Values.autoscaling).enabled }}
  replicas: {{ .Values.personhogRouter.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "posthog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "posthog.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.personhogRouter.repository }}:{{ .Values.image.personhogRouter.tag }}"
          imagePullPolicy: {{ .Values.image.personhogRouter.pullPolicy }}
          env:
            - name: GRPC_ADDRESS
              value: "0.0.0.0:50052"
            - name: METRICS_PORT
              value: {{ .Values.personhogRouter.service.metricsPort | quote }}
            - name: REPLICA_DISCOVERY_MODE
              value: "k8s"
            - name: REPLICA_SERVICE_NAME
              value: {{ include "posthog.component.fullname" (dict "component" "personhog-replica" "Chart" .Chart "Release" .Release "Values" .Values) }}
            - name: K8S_AWARENESS_ENABLED
              value: "true"
            - name: ROUTER_MODE
              value: "replica"
            - name: RUST_LOG
              value: {{ .Values.logging.level | quote }}
            {{- with .Values.personhogRouter.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 50052
              name: grpc
            - containerPort: {{ .Values.personhogRouter.service.metricsPort }}
              name: metrics
          {{- with .Values.personhogRouter.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.personhogRouter.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $gr := .Values.resources }}
          {{- with (coalesce .Values.personhogRouter.resources $gr) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "posthog.affinity" (dict "root" . "valuesKey" "personhogRouter" "component" "personhog-router") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $component "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.personhogRouter.service.grpcPort }}
      targetPort: 50052
      protocol: TCP
      name: grpc
    - port: {{ .Values.personhogRouter.service.metricsPort }}
      targetPort: {{ .Values.personhogRouter.service.metricsPort }}
      protocol: TCP
      name: metrics
  selector:
    {{- include "posthog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
