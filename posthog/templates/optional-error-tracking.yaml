{{- if .Values.features.errorTracking.enabled }}
{{- $component := "ingestion-error-tracking" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $component "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not (coalesce .Values.ingestionErrorTracking.autoscaling .Values.autoscaling).enabled }}
  replicas: {{ .Values.ingestionErrorTracking.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "posthog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "posthog.serviceAccountName" . }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.node.repository }}:{{ .Values.image.node.tag }}"
          imagePullPolicy: {{ .Values.image.node.pullPolicy }}
          command: ["node", "nodejs/dist/index.js"]
          env:
            {{- include "posthog.node.env" . | nindent 12 }}
            - name: PLUGIN_SERVER_MODE
              value: "ingestion-errortracking"
            - name: HTTP_SERVER_PORT
              value: "6741"
            - name: ERROR_TRACKING_CYMBAL_BASE_URL
              value: "http://{{ include "posthog.component.fullname" (dict "component" "cymbal" "Chart" .Chart "Release" .Release "Values" .Values) }}:3302"
            {{- with .Values.ingestionErrorTracking.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 6741
          {{- with (coalesce .Values.ingestionErrorTracking.resources .Values.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "posthog.affinity" (dict "root" . "valuesKey" "ingestionErrorTracking" "component" "ingestion-error-tracking") | nindent 6 }}
---
{{- $component := "cymbal" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $component "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not (coalesce .Values.cymbal.autoscaling .Values.autoscaling).enabled }}
  replicas: {{ .Values.cymbal.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "posthog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "posthog.serviceAccountName" . }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.cymbal.repository }}:{{ .Values.image.cymbal.tag }}"
          imagePullPolicy: {{ .Values.image.cymbal.pullPolicy }}
          env:
            - name: KAFKA_HOSTS
              value: {{ .Values.kafka.hosts | quote }}
            - name: DATABASE_URL
              value: {{ .Values.postgres.url | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: BIND_HOST
              value: "0.0.0.0"
            - name: BIND_PORT
              value: "3302"
            - name: ISSUE_BUCKETS_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: PERSONS_URL
              value: {{ .Values.postgres.personsUrl | default .Values.postgres.url | quote }}
            - name: CYMBAL_REMOTE_RESOLUTION_HOST
              value: {{ include "posthog.component.fullname" (dict "component" "cymbal-resolution" "Chart" .Chart "Release" .Release "Values" .Values) | quote }}
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "posthog.fullname" . }}-secrets
                  key: internalApiSecret
            {{- include "posthog.cymbal.objectStorageEnv" . | nindent 12 }}
            {{- with .Values.cymbal.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 3302
          {{- with (coalesce .Values.cymbal.resources .Values.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "posthog.affinity" (dict "root" . "valuesKey" "cymbal" "component" "cymbal") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" "cymbal" "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: cymbal
spec:
  type: ClusterIP
  ports:
    - port: 3302
      targetPort: 3302
      protocol: TCP
      name: http
  selector:
    {{- include "posthog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cymbal
---
{{- $component := "cymbal-resolution" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $component "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not (coalesce .Values.cymbalResolution.autoscaling .Values.autoscaling).enabled }}
  replicas: {{ .Values.cymbalResolution.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "posthog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "posthog.serviceAccountName" . }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.cymbal.repository }}:{{ .Values.image.cymbal.tag }}"
          imagePullPolicy: {{ .Values.image.cymbal.pullPolicy }}
          env:
            - name: CYMBAL_MODE
              value: "resolution"
            - name: GRPC_ADDRESS
              value: "0.0.0.0:50061"
            - name: DATABASE_URL
              value: {{ .Values.postgres.url | quote }}
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "posthog.fullname" . }}-secrets
                  key: internalApiSecret
            - name: RUST_LOG
              value: {{ .Values.logging.level | quote }}
            {{- include "posthog.cymbal.objectStorageEnv" . | nindent 12 }}
            {{- with .Values.cymbalResolution.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 50061
              name: grpc
          {{- with (coalesce .Values.cymbalResolution.resources .Values.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- include "posthog.affinity" (dict "root" . "valuesKey" "cymbalResolution" "component" "cymbal-resolution") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" "cymbal-resolution" "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: cymbal-resolution
spec:
  # Headless: cymbal's gRPC client balances across the DNS records.
  clusterIP: None
  ports:
    - port: 50061
      targetPort: 50061
      protocol: TCP
      name: grpc
  selector:
    {{- include "posthog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cymbal-resolution
{{- end }}
