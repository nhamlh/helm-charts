apiVersion: v1
kind: Secret
metadata:
  name: {{ include "posthog.fullname" . }}-secrets
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  secretKey: {{ .Values.secrets.secretKey | quote }}
  encryptionSaltKeys: {{ .Values.secrets.encryptionSaltKeys | quote }}
  internalApiSecret: {{ .Values.secrets.internalApiSecret | quote }}
  {{- if .Values.secrets.jwtSecret }}
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.features.temporal.secretKey }}
  temporalSecretKey: {{ .Values.features.temporal.secretKey | quote }}
  {{- end }}
  {{- if .Values.features.livestream.jwtSecret }}
  livestreamJwtSecret: {{ .Values.features.livestream.jwtSecret | quote }}
  {{- end }}
