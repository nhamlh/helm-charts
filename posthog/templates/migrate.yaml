{{- if .Values.migration.enabled }}
{{- $pgComponent := "migrate-postgres" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $pgComponent "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $pgComponent }}
  annotations:
    # Keep the job after completion so we can inspect logs
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "posthog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $pgComponent }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "posthog.hookServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate-postgres
          image: "{{ .Values.image.app.repository }}:{{ .Values.image.app.tag }}"
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          {{- if and .Values.migration.persons.enabled .Values.migration.persons.extraSql }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              ./bin/migrate --scope=postgres --scope=persons && python - <<'PY'
              import json, os, psycopg
              # autocommit: CREATE INDEX CONCURRENTLY cannot run in a transaction.
              with psycopg.connect(os.environ["PERSONS_DB_WRITER_URL"], autocommit=True) as conn:
                  for sql in json.loads(os.environ["PERSONS_EXTRA_SQL"]):
                      print("Running:", sql, flush=True)
                      conn.execute(sql)
              PY
          {{- else if .Values.migration.persons.enabled }}
          command: ["./bin/migrate", "--scope=postgres", "--scope=persons"]
          {{- else }}
          command: ["./bin/migrate", "--scope=postgres"]
          {{- end }}
          env:
            {{- include "posthog.django.env" (dict "root" . "inlineSecrets" true) | nindent 12 }}
            - name: POSTHOG_SKIP_MIGRATION_CHECKS
              value: "1"
            {{- if .Values.migration.persons.enabled }}
            {{- /* bin/migrate runs apply_persons_migrations --hobby only when DEPLOYMENT=hobby. */}}
            {{- if ne (toString .Values.deployment) "hobby" }}
            - name: DEPLOYMENT
              value: hobby
            {{- end }}
            - name: PERSONS_DB_WRITER_URL
              value: {{ coalesce .Values.postgres.personsUrl .Values.postgres.url | quote }}
            {{- if .Values.migration.persons.extraSql }}
            - name: PERSONS_EXTRA_SQL
              value: {{ .Values.migration.persons.extraSql | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.migration.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (coalesce .Values.migration.resources .Values.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- $chComponent := "migrate-clickhouse" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $chComponent "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $chComponent }}
  annotations:
    # Keep the job after completion so we can inspect logs
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "posthog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $chComponent }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "posthog.hookServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate-clickhouse
          image: "{{ .Values.image.app.repository }}:{{ .Values.image.app.tag }}"
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          command: ["./bin/migrate", "--scope=clickhouse"]
          env:
            {{- include "posthog.django.env" (dict "root" . "inlineSecrets" true) | nindent 12 }}
            - name: POSTHOG_SKIP_MIGRATION_CHECKS
              value: "1"
            {{- /* Single-cluster role mapping: every ClickHouse role cluster
                   defaults to clickhouse.cluster. Do NOT set
                   MULTINODE_CLICKHOUSE=1 — it enables role-based routing
                   that requires dedicated LOGS/EVENTS nodes. Override any
                   of these via migration.extraEnv for multi-node setups. */}}
            - name: CLICKHOUSE_MIGRATIONS_CLUSTER
              value: {{ .Values.clickhouse.cluster | quote }}
            - name: CLICKHOUSE_SATELLITE_CLUSTERS
              value: ""
            {{- range list "PRIMARY_REPLICA" "SINGLE_SHARD" "WRITABLE" "AUX" "AI_EVENTS" "OPS" "LOGS" }}
            - name: CLICKHOUSE_{{ . }}_CLUSTER
              value: {{ $.Values.clickhouse.cluster | quote }}
            {{- end }}
            - name: CLICKHOUSE_LOGS_CLUSTER_HOST
              value: {{ .Values.clickhouse.host | quote }}
            - name: CLICKHOUSE_LOGS_CLUSTER_PORT
              value: {{ .Values.clickhouse.port | quote }}
            - name: CLICKHOUSE_LOGS_CLUSTER_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_LOGS_CLUSTER_PASSWORD
              value: {{ .Values.clickhouse.password | quote }}
            {{- with .Values.migration.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (coalesce .Values.migration.resources .Values.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
