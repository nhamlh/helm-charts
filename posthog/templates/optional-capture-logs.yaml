{{- if .Values.features.captureLogs.enabled }}
{{- $component := "capture-logs" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $component "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not (coalesce .Values.captureLogs.autoscaling .Values.autoscaling).enabled }}
  replicas: {{ .Values.captureLogs.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "posthog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "posthog.serviceAccountName" . }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.capture.repository }}:{{ .Values.image.capture.tag }}"
          imagePullPolicy: {{ .Values.image.capture.pullPolicy }}
          env:
            - name: KAFKA_HOSTS
              value: {{ .Values.kafka.hosts | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "posthog.fullname" . }}-secrets
                  key: jwtSecret
            - name: BIND_HOST
              value: "0.0.0.0"
            - name: BIND_PORT
              value: "4318"
            - name: MANAGEMENT_BIND_PORT
              value: "8080"
            {{- with .Values.captureLogs.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 4318
              name: otlp
            - containerPort: 8080
              name: mgmt
          {{- with (coalesce .Values.captureLogs.resources .Values.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with (coalesce .Values.captureLogs.affinity .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $component "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - port: 4318
      targetPort: 4318
      protocol: TCP
      name: otlp
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: mgmt
  selector:
    {{- include "posthog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
{{- end }}
