{{- if .Values.serviceAccount.create }}
# Workload ServiceAccount for long-running Deployments (personhog-router,
# personhog-replica, web, worker, ...). Intentionally NOT a Helm hook: it is
# a normal Helm-managed resource so its UID stays stable across upgrades.
# Recreating this SA (as a `before-hook-creation` hook would on every upgrade)
# gives it a new UID and invalidates the bound ServiceAccount tokens already
# mounted in running pods, which breaks personhog-router's watch on
# EndpointSlices until the pod is restarted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "posthog.serviceAccountName" . }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Ephemeral ServiceAccount for pre-install/pre-upgrade hook Jobs (migrate,
# init). Deployed as a hook at weight -10 so it exists before the migrate Job
# (weight -6/-5) runs. Safe to delete+recreate every upgrade because only
# short-lived Job pods use it (each starts with a fresh token).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "posthog.hookServiceAccountName" . }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
