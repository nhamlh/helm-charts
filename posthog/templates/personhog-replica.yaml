{{- $component := "personhog-replica" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $component "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not (coalesce .Values.personhogReplica.autoscaling .Values.autoscaling).enabled }}
  replicas: {{ .Values.personhogReplica.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "posthog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "posthog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "posthog.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.personhogReplica.repository }}:{{ .Values.image.personhogReplica.tag }}"
          imagePullPolicy: {{ .Values.image.personhogReplica.pullPolicy }}
          env:
            - name: GRPC_ADDRESS
              value: "0.0.0.0:50051"
            - name: METRICS_PORT
              value: {{ .Values.personhogReplica.service.metricsPort | quote }}
            - name: PRIMARY_DATABASE_URL
              {{- if .Values.postgres.personsUrl }}
              value: {{ .Values.postgres.personsUrl | quote }}
              {{- else }}
              value: {{ .Values.postgres.url | quote }}
              {{- end }}
            - name: RUST_LOG
              value: {{ .Values.logging.level | quote }}
            {{- with .Values.personhogReplica.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: {{ .Values.personhogReplica.service.metricsPort }}
              name: metrics
          {{- with .Values.personhogReplica.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.personhogReplica.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $gr := .Values.resources }}
          {{- with (coalesce .Values.personhogReplica.resources $gr) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (coalesce .Values.personhogReplica.affinity .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "posthog.component.fullname" (dict "component" $component "Chart" .Chart "Release" .Release "Values" .Values) }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.personhogReplica.service.grpcPort }}
      targetPort: 50051
      protocol: TCP
      name: grpc
    - port: {{ .Values.personhogReplica.service.metricsPort }}
      targetPort: {{ .Values.personhogReplica.service.metricsPort }}
      protocol: TCP
      name: metrics
  selector:
    {{- include "posthog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
